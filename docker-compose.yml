services:
  kodak2-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/kodak2/}
    image: ${IMAGE_REF:-docker.io/andpra70/kodak-k-print-web:latest}
    container_name: ${CONTAINER_NAME:-kodak2-web}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-6066}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
